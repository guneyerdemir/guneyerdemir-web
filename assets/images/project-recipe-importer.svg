<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <rect width="800" height="480" rx="16" fill="#0B1120"/>
  <rect x="24" y="24" width="752" height="432" rx="12" fill="#111827" stroke="#1E293B" stroke-width="2"/>
  <text x="56" y="72" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="18" font-weight="700">RecipeImporter — PDF Reçete &amp; Kalori Veri İşleme Hattı (ETL)</text>
  <text x="56" y="96" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Gıda Mühendisliği &amp; Veri Otomasyonu • PDF Sayfa Düzeni Analizi • İlişkisel SQLite Veritabanı</text>

  <!-- 3 Step ETL -->
  <rect x="56" y="132" width="204" height="164" rx="10" fill="#0F172A" stroke="#1E293B"/>
  <text x="76" y="164" fill="#F59E0B" font-family="Inter, sans-serif" font-size="12" font-weight="700">1. PDF EXTRACTION</text>
  <text x="76" y="192" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">• PageLayout &amp; Word Analizi</text>
  <text x="76" y="216" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">• RecipeLocator Algoritması</text>
  <text x="76" y="240" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">• BlockExtractor Modülü</text>
  <text x="76" y="268" fill="#64748B" font-family="Inter, sans-serif" font-size="10">raw_recipes tablosu kaydı</text>

  <rect x="296" y="132" width="208" height="164" rx="10" fill="#0F172A" stroke="#0284C7"/>
  <text x="316" y="164" fill="#38BDF8" font-family="Inter, sans-serif" font-size="12" font-weight="700">2. PARSER MOTORU</text>
  <text x="316" y="192" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">• IngredientParser (Gramaj/Birim)</text>
  <text x="316" y="216" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">• CalorieParser (Enerji Hesabı)</text>
  <text x="316" y="240" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">• Instruction &amp; Table Parser</text>
  <text x="316" y="268" fill="#38BDF8" font-family="Inter, sans-serif" font-size="10">Yapılandırılmış Veri Modeli</text>

  <rect x="540" y="132" width="204" height="164" rx="10" fill="#0F172A" stroke="#10B981"/>
  <text x="560" y="164" fill="#34D399" font-family="Inter, sans-serif" font-size="12" font-weight="700">3. SQLITE VERİTABANI</text>
  <text x="560" y="192" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">• recipes (Ana Tarif &amp; Kalori)</text>
  <text x="560" y="216" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">• ingredients (Foreign Key)</text>
  <text x="560" y="240" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">• import_log (Denetim Kaydı)</text>
  <text x="560" y="268" fill="#34D399" font-family="Inter, sans-serif" font-size="10">PRAGMA foreign_keys = ON</text>

  <rect x="56" y="320" width="688" height="98" rx="10" fill="#0F172A" stroke="#1E293B"/>
  <text x="80" y="354" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14" font-weight="700">Gıda Mühendisliği Reçete Standartlaştırma &amp; Veri Mühendisliği</text>
  <text x="80" y="382" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Doküman tabanlı reçete ve kalori tablolarını sorgulanabilir ilişkisel veritabanına dönüştüren modüler Python mimarisi.</text>
</svg>
